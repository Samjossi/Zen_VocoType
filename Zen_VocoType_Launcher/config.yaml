# Zen_VocoType_Launcher 默认配置（本组件唯一配置源）
# 优先级：环境变量（ZEN_VOCOTYPE_LAUNCHER_*）> 本文件 > 代码默认值
# Socket 路径默认值唯一出处在契约库 zen_vocotype_protocol.paths，此处仅允许覆盖；
# 🔴 不要照抄默认值到本文件——那会使唯一出处失效（默认值演进时本文件静默滞留旧值）
# 🔴 路径类配置请写绝对路径（禁止 cwd 相对解析）

# socket_path: /自定义/绝对路径/zen_vocotype.sock          # 取消注释以覆盖契约库默认值
# dev_socket_path: /自定义/绝对路径/zen_vocotype_dev.sock  # --dev 模式覆盖项

# 就绪等待与进程回收（默认值与依据见 src/zen_vocotype_launcher/config.py 字段注释）：
# socket_wait_timeout_s: 15      # 阶段一：Socket 可连接等待上限（秒）
# model_ready_timeout_s: 180     # 阶段二：模型就绪等待上限（秒）
# ready_poll_interval_ms: 200    # ready 轮询间隔（毫秒）
# terminate_grace_seconds: 5     # 进程组终止 SIGTERM→SIGKILL 宽限（秒）

# 正式模式二进制显式路径（默认按邻接目录约定 → ~/AppImages 兜底自动解析，一般无需配置）：
# service_binary: /自定义/绝对路径/Zen_VocoType_Service.AppImage
# client_binary: /自定义/绝对路径/Zen_VocoType_Client.AppImage

# T40 启动编排与托盘（托盘菜单可图形化设置，持久化至用户配置文件）：
# service_start_delay_s: 0    # Launcher 启动后多少秒拉起服务端（0~300）
# client_start_interval_s: 0  # 服务端拉起后隔多少秒拉起客户端（0~300；模型加载慢的机器建议 10~20）
# exit_after_success_s: 60   # 编排成功后托盘停留秒数（30~300，T44 单一定时器；仅托盘模式；失败不自动退出）
