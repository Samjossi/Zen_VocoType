# Zen_VocoType_Client 默认配置（本组件唯一配置源）
# 优先级：环境变量（ZEN_VOCOTYPE_CLIENT_*）> 本文件 > 代码默认值
# Socket 路径默认值唯一出处在契约库 zen_vocotype_protocol.paths，此处仅允许覆盖；
# 🔴 不要照抄默认值到本文件——那会使唯一出处失效（默认值演进时本文件静默滞留旧值）
# 🔴 路径类配置请写绝对路径（禁止 cwd 相对解析）

# socket_path: /自定义/绝对路径/zen_vocotype.sock  # 取消注释以覆盖契约库默认值

# 全局热键（pynput 组合键表达式，按住说话、松开停止）
# 默认 <ctrl>+<alt>+y；🔴 勿改回 <ctrl>+`（与旧版 GridChat 冲突）、<ctrl>+<alt>+v 或 <ctrl>+<alt>+t（本机已占用）
hotkey: "<ctrl>+<alt>+y"
# 剪贴板恢复延迟（毫秒）：粘贴动作发出后恢复原剪贴板内容的保守延迟，
# 命名常量 + 可配置（默认 200ms；恢复前须校验剪贴板内容仍为本进程写入，
# 个别应用读取偏慢导致粘贴到旧内容时可调大）
paste_restore_delay_ms: 200

# 最大录音时长（秒）：对齐协议体上限留足余量，到达上限自动停止并进入识别
# max_record_seconds: 60

# 录音输入设备（sounddevice 设备名或索引）；缺省为系统默认输入设备
# input_device: null

# 同类错误通知去重窗口（秒），防止通知轰炸
# notify_dedup_seconds: 5

# 声音辅助提示开关（默认关闭）
# enable_sound_notify: false

# 服务端模型加载中（托盘橙灯「连接中…」）的 health 轮询间隔（毫秒，默认 3000）：
# 客户端按此间隔自动探测，模型就绪后托盘自动转绿
# loading_poll_interval_ms: 3000

# 加载中轮询最大次数（默认 120 次 × 3s ≈ 6 分钟，覆盖大模型冷启动）：
# 达上限停止轮询并通知，需从托盘菜单「重试连接服务端」手动重试
# loading_poll_max_count: 120

# 录音/识别文本落盘总开关（默认 true）：每次录音保存 WAV + 识别文本 TXT；
# 托盘菜单「保存录音」勾选项可实时切换（持久化到用户配置文件）
# save_recordings: true

# 录音保存目录（🔴 必须绝对路径；默认 XDG data 下 zen_vocotype/recordings，
# 默认值唯一出处在契约库 paths.get_recordings_dir，勿照抄）；
# 托盘菜单「选择保存路径…」可图形化修改
# recordings_dir: /自定义/绝对路径/recordings
