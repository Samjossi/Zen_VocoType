# Zen_VocoType_Service 默认配置（本组件唯一配置源）
# 优先级：环境变量（ZEN_VOCOTYPE_SERVICE_*）> 本文件 > 代码默认值
# Socket 路径默认值唯一出处在契约库 zen_vocotype_protocol.paths，此处仅允许覆盖；
# 🔴 不要照抄默认值到本文件——那会使唯一出处失效（默认值演进时本文件静默滞留旧值）
# 🔴 路径类配置请写绝对路径；相对路径违反大纲原则 3（禁止 cwd 相对解析），
#    模型/日志目录默认值已在代码中按组件自身目录解析，此处无需配置

# socket_path: /自定义/绝对路径/zen_vocotype.sock  # 取消注释以覆盖契约库默认值

# 默认加载模型（须存在于模型注册表）
default_model: paraformer-large

# 模型注册表（缺省内置 paraformer-large 与 sensevoice-small 两条，此处仅演示写法；
# 🔴 内置默认值勿照抄——照抄会使代码默认值演进时本文件静默滞留旧值。
# 仅在需要新增/修改条目时配置）：
# models:
#   my-local-model:            # 注册名（model_switch 的 model_name 取值）
#     local_path: /绝对路径/到/模型目录   # 与 model_id 二选一
#   my-online-model:
#     model_id: iic/SenseVoiceSmall      # modelscope 缓存命中/在线下载
#     vad_model_id: iic/speech_fsmn_vad_zh-cn-16k-common-pytorch   # 可选附属模型
#     punc_model_id: iic/punc_ct-transformer_zh-cn-common-vocab272727-pytorch
