[project]
name = "zen-vocotype-service"
version = "0.1.0"
description = "Zen_VocoType 服务端：FunASR 模型加载与推理、Unix Socket 服务、模型管理"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zen-vocotype-protocol",
    "funasr",
    "torch",
    "modelscope",
    "pydantic-settings",
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zen_vocotype_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
