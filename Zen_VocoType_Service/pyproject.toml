[project]
name = "zen-vocotype-service"
dynamic = ["version"]
description = "Zen_VocoType 服务端：FunASR 模型加载与推理、Unix Socket 服务、模型管理"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zen-vocotype-protocol",
    "funasr",
    "torch",
    "modelscope",
    "PySide6",
    "pydantic-settings",
    "pyyaml",
    "loguru",
]

[tool.hatch.version]
#: 版本号单一出处为 version.py 的 SERVICE_VERSION（🔴 唯一真相为仓库根
#: versions.toml，由 tools/sync_versions.py 同步，禁止手改）
path = "src/zen_vocotype_service/version.py"
pattern = "SERVICE_VERSION: str = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/zen_vocotype_service"]

[tool.pytest.ini_options]
markers = [
    "slow: 真实模型加载/推理的慢速集成测试（默认跳过，-m slow 显式运行）",
]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
